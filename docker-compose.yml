
services:
    app:
        build: .
        container_name: ecommerce-app
        ports:
            - "8000:8000"
        env_file:
            - .env
        environment:
            DB_CONNECTION: pgsql
            DB_DATABASE: /var/www/html/database/database.sqlite
            PGSQL_HOST: ecommerce-primary
            PGSQL_PORT: "5432"
            PGSQL_DATABASE: ecommerce
            PGSQL_USERNAME: ecommerce_user
            PGSQL_PASSWORD: ecommerce_dev_password
            PGSQL_READ_HOST: ecommerce-replica
            PGSQL_WRITE_HOST: ecommerce-primary
            REVERB_HOST: reverb
            REVERB_PORT: "8080"
            REVERB_SCHEME: http
        volumes:
            - ./database/database.sqlite:/var/www/html/database/database.sqlite
            - ./storage/app/public:/var/www/html/storage/app/public
        restart: unless-stopped


    queue-worker:
        image: internet-apps-ecommerce-app
        container_name: ecommerce-queue-worker
        command:
            - php
            - artisan
            - queue:work
            - rabbitmq
            - --queue=emails
            - --tries=3
            - --timeout=90
            - --sleep=3
            - --verbose
        env_file:
            - .env
        environment:
            DB_CONNECTION: pgsql
            DB_DATABASE: /var/www/html/database/database.sqlite
            PGSQL_HOST: ecommerce-primary
            PGSQL_PORT: "5432"
            PGSQL_DATABASE: ecommerce
            PGSQL_USERNAME: ecommerce_user
            PGSQL_PASSWORD: ecommerce_dev_password
            PGSQL_READ_HOST: ecommerce-replica
            PGSQL_WRITE_HOST: ecommerce-primary
        volumes:
            - ./database/database.sqlite:/var/www/html/database/database.sqlite
            - ./storage/app/public:/var/www/html/storage/app/public
        depends_on:
            rabbitmq:
                condition: service_healthy
            ecommerce-primary:
                condition: service_healthy
            ecommerce-replica:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped


    inventory-db:
        image: postgres:16-alpine
        container_name: ecommerce-inventory-db
        environment:
            POSTGRES_DB: inventory_db
            POSTGRES_USER: inventory_user
            POSTGRES_PASSWORD: inventory_dev_password
        volumes:
            - inventory-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped


    inventory-service:
        build:
            context: ./inventory-service
            dockerfile: Dockerfile
        container_name: ecommerce-inventory-service
        environment:
            DATABASE_URL: postgresql://inventory_user:inventory_dev_password@inventory-db:5432/inventory_db
        ports:
            - "50051:50051"
        depends_on:
            inventory-db:
                condition: service_healthy
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:4-management-alpine
        container_name: ecommerce-rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: ecommerce_rabbitmq
            RABBITMQ_DEFAULT_PASS: rabbitmq_dev_password
            RABBITMQ_DEFAULT_VHOST: /
        ports:
            - "15672:15672"
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped


    reverb:
        image: internet-apps-ecommerce-app
        container_name: ecommerce-reverb
        command:
            - php
            - artisan
            - reverb:start
            - --host=0.0.0.0
            - --port=8080
        env_file:
            - .env
        environment:
            REVERB_SERVER_HOST: 0.0.0.0
            REVERB_SERVER_PORT: "8080"
            REVERB_HOST: reverb
            REVERB_PORT: "8080"
            REVERB_SCHEME: http
        ports:
            - "8080:8080"
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: ecommerce-redis
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    ecommerce-primary:
        build:
            context: ./docker/postgres/primary
            dockerfile: Dockerfile
        container_name: ecommerce-primary
        environment:
            POSTGRES_DB: ecommerce
            POSTGRES_USER: ecommerce_user
            POSTGRES_PASSWORD: ecommerce_dev_password
            REPLICATION_PASSWORD: replication_dev_password
        command:
            - postgres
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=10
            - -c
            - max_replication_slots=10
        volumes:
            - ecommerce-primary-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce"]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    ecommerce-replica:
        build:
            context: ./docker/postgres/replica
            dockerfile: Dockerfile
        container_name: ecommerce-replica
        environment:
            POSTGRES_DB: ecommerce
            POSTGRES_USER: ecommerce_user
            POSTGRES_PASSWORD: ecommerce_dev_password
            REPLICATION_PASSWORD: replication_dev_password
        volumes:
            - ecommerce-replica-data:/var/lib/postgresql/data
        depends_on:
            ecommerce-primary:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: unless-stopped


volumes:
    inventory-data:
    redis-data:
    ecommerce-primary-data:
    ecommerce-replica-data:
    rabbitmq-data:
